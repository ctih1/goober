exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 94
indent-width = 4

target-version = "py310"

[lint]
ignore=[
    "UP006", # e.g. use dict instead of Dict for typing
    "DTZ001", # specify timezone
    "DTZ005" # specify timezone
]


[format]
quote-style="double"
indent-style="space"
line-ending="lf"
nested-string-quote-style="preferred"
